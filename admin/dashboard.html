<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | MIA TEX</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container-fluid">

<div class="row">

<!-- MENU -->

<div class="col-lg-3 bg-dark text-white p-4 sidebar">

<h3 class="text-warning fw-bold mb-4">
MIA TEX
</h3>

<button class="btn btn-warning w-100 mb-3" id="btnNuevo">

+ Nuevo Producto

</button>

<button class="btn btn-outline-light w-100" id="btnCerrar">

Cerrar Sesión

</button>

</div>

<!-- CONTENIDO -->

<div class="col-lg-9 p-4">

<h2 class="fw-bold mb-4">

Administrar Productos

</h2>

<div class="card shadow border-0 rounded-4 p-4 mb-4">

<h5 class="mb-3">

Nuevo Producto

</h5>

<input
type="text"
id="nombre"
class="form-control mb-3"
placeholder="Nombre del producto">

<input
type="number"
id="precio"
class="form-control mb-3"
placeholder="Precio">

<textarea
id="descripcion"
class="form-control mb-3"
rows="4"
placeholder="Descripción"></textarea>

<input
type="file"
id="imagen"
class="form-control mb-3">

<button
class="btn btn-warning"
id="btnGuardar">

Guardar Producto

</button>

</div>

<h4 class="mb-3">

Productos

</h4>

<div id="listaProductos">

</div>

</div>

</div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
